<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thời khóa biểu</title>
  <style>
    table { border-collapse: collapse; margin: 20px auto; background: white; }
    th, td { border: 1px solid #888; width: 90px; height: 30px; text-align: center; }
    th, .tiet { color: #B04040; background: #FBEFE0; }
    .tiet { font-weight: bold; }
    .tkweb { background: #92D050; }
    .tkcsdl { background: #ADD8E6; }
    .hdh { background: #5B8DD6; }
    .csdl { background: #DDA5A5; }
    .ltdt { background: #FFC000; }
  </style>
</head>
<body>
  <table>
    <tr>
      <th></th><th>Thứ 2</th><th>Thứ 3</th><th>Thứ 4</th>
      <th>Thứ 5</th><th>Thứ 6</th><th>Thứ 7</th><th>CN</th>
    </tr>
    <tr>
      <td class="tiet">Tiết 1</td>
      <td class="tkweb">TKWeb 1</td><td></td><td></td>
      <td class="ltdt">LTĐT</td><td></td><td></td>
      <td class="tkcsdl">TK CSDL</td>
    </tr>
    <tr>
      <td class="tiet">Tiết 2</td>
      <td class="hdh">HĐH</td><td class="tkcsdl">TK CSDL</td>
      <td class="tkweb">TKWeb 1</td><td></td>
      <td class="tkweb">TKWeb 1</td><td class="csdl">CSDL</td><td></td>
    </tr>
    <tr>
      <td class="tiet">Tiết 3</td>
      <td class="csdl">CSDL</td><td class="ltdt">LTĐT</td>
      <td class="hdh">HĐH</td><td class="tkcsdl">TK CSDL</td><td></td>
      <td class="ltdt">LTĐT</td><td class="tkweb">TKWeb 1</td>
    </tr>
    <tr>
      <td class="tiet">Tiết 4</td>
      <td></td><td></td><td class="csdl">CSDL</td><td></td>
      <td class="hdh">HĐH</td><td></td><td></td>
    </tr>
  </table>
</body>
</html>
