<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Các món ngon</title>
  <style>
    body { background: #FFEDCA; margin: 0; }

    .khung { display: flex; align-items: flex-start; }
    .khung img { width: 230px; margin: 0 15px 0 0; }

    .noidung { width: 480px; }
    h1 { color: #8A2BE2; text-align: center; margin: 15px 0; }

    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid gray; padding: 3px 6px; text-align: left; }
    th { background: #CC6600; color: #FFFFFF; }
    th:first-child { width: 50px; text-align: center; }
    td:first-child { text-align: center; }

    tr:nth-child(even) td { background: #FFFFFF; }
    tr:nth-child(odd) td { background: #FFEDCA; }
  </style>
</head>
<body>
  <div class="khung">
    <img src="BTTH1_Hinh2/monan.png" alt="Món ăn">
    <div class="noidung">
      <h1>Các món ngon</h1>
      <table>
        <tr><th>STT</th><th style="text-align:center">Tên món ăn</th></tr>
        <tr><td>1.</td><td>Bánh mỳ</td></tr>
        <tr><td>2.</td><td>Bánh xèo</td></tr>
        <tr><td>3.</td><td>Bánh cuốn</td></tr>
        <tr><td>4.</td><td>Phở</td></tr>
        <tr><td>5.</td><td>Bún bò</td></tr>
        <tr><td>6.</td><td>Cháo lòng</td></tr>
        <tr><td>7.</td><td>Bún thịt nướng</td></tr>
        <tr><td>8.</td><td>Cơm tấm</td></tr>
      </table>
    </div>
  </div>
</body>
</html>
