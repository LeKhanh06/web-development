<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Máy tính</title>
  <style>
    body { font-family: "Times New Roman", serif; font-size: 16px; }

    form {
      background: #b5d7e4;
      width: 315px;
      box-sizing: border-box;
      padding: 8px 3px 10px;
    }

    h3 {
      text-align: center;
      margin: 0 0 14px;
      line-height: 22px;
    }

    .dong {
      display: flex;
      align-items: center;
    }

    label { width: 112px; }

    input[type="text"] {
      width: 180px;
      height: 24px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 16px;
    }

    .nut {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 10px 0 11px;
    }

    .nut input {
      height: 24px;
      font-family: inherit;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <form>
    <h3>Máy tính</h3>

    <div class="dong" style="margin-bottom:17px">
      <label>Số thứ nhất</label>
      <input type="text" id="a">
    </div>

    <div class="dong">
      <label>Số thứ hai</label>
      <input type="text" id="b">
    </div>

    <div class="nut">
      <input type="button" value="Cộng" onclick="tinh('+')">
      <input type="button" value="Trừ" onclick="tinh('-')">
      <input type="button" value="Nhân" onclick="tinh('*')">
      <input type="button" value="Chia" onclick="tinh('/')">
    </div>

    <div class="dong">
      <label>Kết quả</label>
      <input type="text" id="kq">
    </div>
  </form>

  <script>
    function tinh(pt) {
      var a = Number(document.getElementById("a").value);
      var b = Number(document.getElementById("b").value);
      var kq;
      if (pt == "+") kq = a + b;
      else if (pt == "-") kq = a - b;
      else if (pt == "*") kq = a * b;
      else kq = a / b;
      document.getElementById("kq").value = kq;
    }
  </script>
</body>
</html>
