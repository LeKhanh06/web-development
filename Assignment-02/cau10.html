<!DOCTYPE html>
<!-- Câu 10: Danh sách công việc (làm thêm câu 3). HTML/CSS trong file này; JavaScript nằm ở cau10.js. -->
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Làm thêm 3 — Công việc</title>
        <!-- CSS dùng chung -->
        <style id="common-style">
/* CSS chung: bố cục cơ bản, bảng, ô nhập và nút. Mỗi bài tải thêm file CSS cùng tên. */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 16px;
    color: black;
    background: white;
    font: 16px "Times New Roman", serif;
    line-height: 1.2;
}

main {
    max-width: 1000px;
    margin: auto;
}

h1,
h2,
h3 {
    text-align: center;
}

a {
    color: #0033cc;
}

nav {
    margin-bottom: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    background: white;
}

th,
td {
    border: 1px solid #888;
    padding: 8px;
    text-align: left;
}

th {
    text-align: center;
}

input,
select,
textarea,
button {
    font: inherit;
    max-width: 100%;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="range"]),
textarea {
    width: 100%;
}

input,
select,
textarea {
    padding: 5px;
}

button {
    padding: 6px 16px;
    cursor: pointer;
}

button:focus-visible,
a:focus-visible {
    outline: 3px solid #006d77;
    outline-offset: 2px;
}

select[multiple] {
    width: 100%;
    min-height: 150px;
}

.form-table {
    max-width: 650px;
    margin: 16px auto;
}

.center {
    text-align: center;
}

.note {
    color: #555;
}

.error {
    color: #a40000;
}

@media (max-width: 750px) {
    body {
        padding: 12px;
    }
}

@media print {
    nav,
    .print-button {
        display: none;
    }
}

@media print {
    body {
        background: white;
        padding: 0;
    }
}

main {
    max-width: 920px;
}

nav {
    margin-bottom: 24px;
    font: 13px Arial, sans-serif;
}

h1 {
    font-size: 22px;
}

table {
    margin: 0;
}

th,
td {
    padding: 3px 5px;
    text-align: left;
    border-color: #999;
}

caption {
    padding: 4px;
    border: 1px solid #999;
    border-bottom: 0;
    font-weight: bold;
}

input,
select,
textarea,
button {
    font: 13px Arial, sans-serif;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="range"]):not([type="file"]) {
    width: 200px;
    height: 22px;
    padding: 1px 3px;
}

select {
    padding: 0;
}

textarea {
    padding: 2px;
}

button {
    padding: 2px 12px;
}

select[multiple] {
    min-height: 0;
}

.form-table {
    margin: 0 auto;
}

.note,
small {
    font: 12px Arial, sans-serif;
}

@media (max-width: 650px) {
    body {
        padding: 16px 8px;
    }
}
        </style>
        <!-- CSS riêng của câu 10 -->
        <style id="exercise-style">
/* Làm thêm 3 — Danh sách công việc. */

.todo {
    background: #00a2bf;
}

.todo h1 {
    color: white;
}

.todo form {
    display: flex;
    gap: 8px;
}

.todo ul {
    padding: 0;
    list-style: none;
}

.todo li {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    padding: 8px;
    background: #73d3e0;
}

.todo li span {
    flex: 1;
    overflow-wrap: anywhere;
}

.todo li.done {
    background: #52df6f;
}

.todo li.done span {
    text-decoration: line-through;
}

.todo {
    font-family: Arial, sans-serif;
}

.todo main {
    max-width: 700px;
}

.todo h1 {
    margin: 0 0 18px;
    font-size: 28px;
}

.todo .instructions {
    text-align: center;
    font-size: 13px;
    font-weight: bold;
}

.todo .instructions p:nth-child(1) {
    color: #ffdf00;
}

.todo .instructions p:nth-child(2) {
    color: #72e26b;
}

.todo .instructions p:nth-child(3) {
    color: #005e70;
}

.todo form {
    gap: 0;
    margin: 55px 0 12px;
}

.todo #new-task {
    flex: 1;
    width: 100%;
    height: 30px;
    border: 0;
    border-radius: 3px 0 0 3px;
    padding: 5px;
}

.todo form button {
    background: #00758b;
    color: white;
    border: 0;
    border-radius: 0 3px 3px 0;
}

.todo ul {
    padding: 0 24px;
}

.todo li {
    padding: 8px 12px;
    border: 1px solid #008599;
    border-radius: 3px;
    background: #43b9cd;
    color: white;
    font-size: 13px;
}

.todo li span {
    cursor: pointer;
}

.todo li button {
    background: none;
    border: 0;
    padding: 0 4px;
    color: #00687a;
    font-weight: bold;
}

.todo li.done {
    color: #18803b;
}

.todo #empty-message {
    text-align: center;
    font-size: 13px;
    color: #005e70;
}
        </style>
        <!-- CSS chỉ dùng khi mở trang kết quả, không áp dụng cho trang hiện tại. -->
        <style id="result-style" media="not all">
/* Định dạng chung cho trang hóa đơn, vé, đăng ký tour và kết quả CV. */

.result-page main {
    max-width: 460px;
    padding: 8px;
    border: 1px solid #888;
}

.result-page h1 {
    margin: 0 0 18px;
    font-size: 18px;
}

.result-page p {
    margin: 12px 0;
}

.result-page table {
    margin-top: 15px;
}

.result-page th,
.result-page td {
    border: 0;
    padding: 8px;
    text-align: center;
}

.result-page tr:last-child {
    font-weight: bold;
}

.result-page .print-button {
    display: block;
    margin: 20px auto 0;
}
        </style>
    </head>
    <body class="todo">
        <main>
            <nav>
                <a href="index.html">← Danh sách bài</a>
            </nav>
            <h1>WORK TO-DOS</h1>
            <div class="instructions">
                <p>Nhập công việc vào ô bên dưới để thêm vào danh sách.</p>
                <p>Nhấn vào công việc để đánh dấu hoàn thành.</p>
                <p>Nhấn vào “×” để xóa công việc khỏi danh sách.</p>
            </div>
            <form id="todo-form">
                <input id="new-task" placeholder="Công việc mới..." aria-label="Công việc mới" required>
                <button>Thêm</button>
            </form>
            <ul id="tasks">
            </ul>
            <p id="empty-message">Chưa có công việc.</p>
        </main>
        <!-- JavaScript đặt sau HTML để các ô và nút đã tồn tại khi xử lý. -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="cau10.js"></script>
    </body>
</html>
