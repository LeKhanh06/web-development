<!DOCTYPE html>
<!-- Câu 9: Slideshow ảnh (làm thêm câu 2). HTML/CSS trong file này; JavaScript nằm ở cau9.js. -->
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Làm thêm 2 — Slideshow</title>
        <!-- CSS dùng chung -->
        <style id="common-style">
/* CSS chung: bố cục cơ bản, bảng, ô nhập và nút. Mỗi bài tải thêm file CSS cùng tên. */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 16px;
    color: black;
    background: white;
    font: 16px "Times New Roman", serif;
    line-height: 1.2;
}

main {
    max-width: 1000px;
    margin: auto;
}

h1,
h2,
h3 {
    text-align: center;
}

a {
    color: #0033cc;
}

nav {
    margin-bottom: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    background: white;
}

th,
td {
    border: 1px solid #888;
    padding: 8px;
    text-align: left;
}

th {
    text-align: center;
}

input,
select,
textarea,
button {
    font: inherit;
    max-width: 100%;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="range"]),
textarea {
    width: 100%;
}

input,
select,
textarea {
    padding: 5px;
}

button {
    padding: 6px 16px;
    cursor: pointer;
}

button:focus-visible,
a:focus-visible {
    outline: 3px solid #006d77;
    outline-offset: 2px;
}

select[multiple] {
    width: 100%;
    min-height: 150px;
}

.form-table {
    max-width: 650px;
    margin: 16px auto;
}

.center {
    text-align: center;
}

.note {
    color: #555;
}

.error {
    color: #a40000;
}

@media (max-width: 750px) {
    body {
        padding: 12px;
    }
}

@media print {
    nav,
    .print-button {
        display: none;
    }
}

@media print {
    body {
        background: white;
        padding: 0;
    }
}

main {
    max-width: 920px;
}

nav {
    margin-bottom: 24px;
    font: 13px Arial, sans-serif;
}

h1 {
    font-size: 22px;
}

table {
    margin: 0;
}

th,
td {
    padding: 3px 5px;
    text-align: left;
    border-color: #999;
}

caption {
    padding: 4px;
    border: 1px solid #999;
    border-bottom: 0;
    font-weight: bold;
}

input,
select,
textarea,
button {
    font: 13px Arial, sans-serif;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="range"]):not([type="file"]) {
    width: 200px;
    height: 22px;
    padding: 1px 3px;
}

select {
    padding: 0;
}

textarea {
    padding: 2px;
}

button {
    padding: 2px 12px;
}

select[multiple] {
    min-height: 0;
}

.form-table {
    margin: 0 auto;
}

.note,
small {
    font: 12px Arial, sans-serif;
}

@media (max-width: 650px) {
    body {
        padding: 16px 8px;
    }
}
        </style>
        <!-- CSS riêng của câu 9 -->
        <style id="exercise-style">
/* Làm thêm 2 — Slideshow ảnh. */

.slider {
    display: flex;
    align-items: center;
    gap: 8px;
}

.viewport {
    overflow: hidden;
    flex: 1;
}

.track {
    display: flex;
    transition: transform .4s ease;
}

.slide {
    flex: 0 0 20%;
    padding: 5px;
}

.slide img {
    display: block;
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.slide p {
    text-align: center;
    margin: 4px 0;
}

.slideshow-page h1 {
    display: none;
}

.slide img {
    object-fit: contain;
}

.slider > button {
    align-self: flex-start;
    margin-top: 35px;
    padding: 10px 3px;
    border: 0;
    background: orange;
    color: white;
}

.slideshow-page main > p {
    font-size: 13px;
}

@media (max-width: 650px) {
    .slide img {
        height: 100px;
    }
}
        </style>
        <!-- CSS chỉ dùng khi mở trang kết quả, không áp dụng cho trang hiện tại. -->
        <style id="result-style" media="not all">
/* Định dạng chung cho trang hóa đơn, vé, đăng ký tour và kết quả CV. */

.result-page main {
    max-width: 460px;
    padding: 8px;
    border: 1px solid #888;
}

.result-page h1 {
    margin: 0 0 18px;
    font-size: 18px;
}

.result-page p {
    margin: 12px 0;
}

.result-page table {
    margin-top: 15px;
}

.result-page th,
.result-page td {
    border: 0;
    padding: 8px;
    text-align: center;
}

.result-page tr:last-child {
    font-weight: bold;
}

.result-page .print-button {
    display: block;
    margin: 20px auto 0;
}
        </style>
    </head>
    <body class="slideshow-page">
        <main>
            <nav>
                <a href="index.html">← Danh sách bài</a>
            </nav>
            <h1>Slideshow ảnh</h1>
            <p>Danh sách gồm 10 ảnh, mỗi lần hiển thị 5 ảnh. Tự trượt sau mỗi 3 giây.</p>
            <div class="slider">
                <button id="previous" type="button" aria-label="Ảnh trước">❮</button>
                <div class="viewport">
                    <div id="track" class="track">
                    </div>
                </div>
                <button id="next" type="button" aria-label="Ảnh tiếp theo">❯</button>
            </div>
            <p class="center">
                <button id="toggle-slide" type="button">Tạm dừng</button>
            </p>
            <p class="note">Thêm ảnh picture/hoa-01.jpg đến picture/hoa-10.jpg. Khi chưa có ảnh, ô sẽ hiện tên ảnh cần thêm.</p>
        </main>
        <!-- JavaScript đặt sau HTML để các ô và nút đã tồn tại khi xử lý. -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="cau9.js"></script>
    </body>
</html>
