<!DOCTYPE html>
<!-- Câu 1: Tính lương tháng. HTML/CSS trong file này; JavaScript nằm ở cau1.js. -->
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Câu 1 — Tính lương</title>
        <!-- CSS dùng chung -->
        <style id="common-style">
/* CSS chung: bố cục cơ bản, bảng, ô nhập và nút. Mỗi bài tải thêm file CSS cùng tên. */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 16px;
    color: black;
    background: white;
    font: 16px "Times New Roman", serif;
    line-height: 1.2;
}

main {
    max-width: 1000px;
    margin: auto;
}

h1,
h2,
h3 {
    text-align: center;
}

a {
    color: #0033cc;
}

nav {
    margin-bottom: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    background: white;
}

th,
td {
    border: 1px solid #888;
    padding: 8px;
    text-align: left;
}

th {
    text-align: center;
}

input,
select,
textarea,
button {
    font: inherit;
    max-width: 100%;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="range"]),
textarea {
    width: 100%;
}

input,
select,
textarea {
    padding: 5px;
}

button {
    padding: 6px 16px;
    cursor: pointer;
}

button:focus-visible,
a:focus-visible {
    outline: 3px solid #006d77;
    outline-offset: 2px;
}

select[multiple] {
    width: 100%;
    min-height: 150px;
}

.form-table {
    max-width: 650px;
    margin: 16px auto;
}

.center {
    text-align: center;
}

.note {
    color: #555;
}

.error {
    color: #a40000;
}

@media (max-width: 750px) {
    body {
        padding: 12px;
    }
}

@media print {
    nav,
    .print-button {
        display: none;
    }
}

@media print {
    body {
        background: white;
        padding: 0;
    }
}

main {
    max-width: 920px;
}

nav {
    margin-bottom: 24px;
    font: 13px Arial, sans-serif;
}

h1 {
    font-size: 22px;
}

table {
    margin: 0;
}

th,
td {
    padding: 3px 5px;
    text-align: left;
    border-color: #999;
}

caption {
    padding: 4px;
    border: 1px solid #999;
    border-bottom: 0;
    font-weight: bold;
}

input,
select,
textarea,
button {
    font: 13px Arial, sans-serif;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="range"]):not([type="file"]) {
    width: 200px;
    height: 22px;
    padding: 1px 3px;
}

select {
    padding: 0;
}

textarea {
    padding: 2px;
}

button {
    padding: 2px 12px;
}

select[multiple] {
    min-height: 0;
}

.form-table {
    margin: 0 auto;
}

.note,
small {
    font: 12px Arial, sans-serif;
}

@media (max-width: 650px) {
    body {
        padding: 16px 8px;
    }
}
        </style>
        <!-- CSS riêng của câu 1 -->
        <style id="exercise-style">
/* Câu 1 — Tính lương tháng. Chỉnh đường dọc ở .salary th; chỉnh nút ở .salary .center button. */

.salary main {
    max-width: 940px;
}

.salary .form-table {
    width: 640px;
    max-width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
    background: #ffd098;
    border: 5px double #000099;
    font: 18px/1 "Times New Roman", serif;
}

.salary th,
.salary td {
    height: 26.5px;
    border: 1px solid #000099;
    padding: 0 3px;
    vertical-align: middle;
}

.salary th {
    width: 110px;
    font-weight: bold;
    white-space: nowrap;
}

.salary #salary,
.salary #coefficient {
    height: 21px;
    max-width: 100%;
    padding: 0 4px;
    border: 2px inset #ddd;
    background: white;
    color: black;
    font: 16px/1 "Times New Roman", serif;
}

.salary #salary {
    width: 63%;
    border-radius: 0;
}

.salary .salary-coefficient {
    display: inline-flex;
    vertical-align: middle;
    width: 95px;
    height: 22px;
    overflow: hidden;
    border: 1px solid #8996a4;
    border-radius: 6px;
    background: linear-gradient(#e3e3e3, white 45%, #f1f1f1);
    box-shadow: 1px 1px 1px #aaa;
}

.salary #coefficient {
    flex: 1;
    width: 0;
    min-width: 0;
    height: 20px;
    padding: 0 8px;
    border: 0;
    border-radius: 0;
    background: transparent;
    font: 16px/1 "Times New Roman", serif;
    appearance: textfield;
}

.salary #coefficient::-webkit-inner-spin-button,
.salary #coefficient::-webkit-outer-spin-button {
    appearance: none;
    margin: 0;
}

.salary .salary-stepper {
    display: flex;
    flex-direction: column;
    flex: 0 0 28px;
    border-left: 1px solid #9ab5c5;
    background: linear-gradient(#e1f4ff, #8dc9ed 48%, #caeaff 52%, #7cbce6);
}

.salary .salary-stepper button {
    width: 28px;
    max-width: none;
    height: 10px;
    min-height: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    color: #10344c;
    font: 8px/10px "Times New Roman", serif;
}

.salary .salary-stepper button:hover {
    background: #aad8f4;
}

.salary .salary-stepper button:active {
    background: #74b8e2;
}

.salary .center {
    padding-top: 3px;
    padding-bottom: 3px;
}

.salary .center button {
    display: block;
    margin: 0 auto;
    width: calc(30% + 6px);
    max-width: 100%;
    height: 21px;
    padding: 0 6px;
    border: 2px solid #9bbdce;
    border-radius: 20px;
    background: white;
    box-shadow: 0 1px 2px 1px #a4b9c4, inset 0 1px 1px #e1e9ed;
    color: black;
    font: normal 16px/1 "Times New Roman", serif;
    letter-spacing: .3px;
    white-space: nowrap;
    transform: translateX(-50px);
}
        </style>
        <!-- CSS chỉ dùng khi mở trang kết quả, không áp dụng cho trang hiện tại. -->
        <style id="result-style" media="not all">
/* Định dạng chung cho trang hóa đơn, vé, đăng ký tour và kết quả CV. */

.result-page main {
    max-width: 460px;
    padding: 8px;
    border: 1px solid #888;
}

.result-page h1 {
    margin: 0 0 18px;
    font-size: 18px;
}

.result-page p {
    margin: 12px 0;
}

.result-page table {
    margin-top: 15px;
}

.result-page th,
.result-page td {
    border: 0;
    padding: 8px;
    text-align: center;
}

.result-page tr:last-child {
    font-weight: bold;
}

.result-page .print-button {
    display: block;
    margin: 20px auto 0;
}
        </style>
    </head>
    <body class="salary">
        <main>
            <nav>
                <a href="index.html">← Danh sách bài</a>
            </nav>
            <!-- form gom các ô nhập; submit cho phép tính bằng nút bấm hoặc phím Enter. -->
            <form id="salary-form">
                <table class="form-table">
                    <tr>
                        <th>
                            <label for="salary">Lương</label>
                        </th>
                        <td>
                            <input id="salary" type="number" min="0" step="any" value="1000000" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label for="coefficient">Hệ số lương</label>
                        </th>
                        <td>
                            <!-- Khung riêng giúp hai nút tăng giảm có nền xanh giống hình mẫu. -->
                            <span class="salary-coefficient">
                                <input id="coefficient" type="number" min="0" step="0.1" value="3.2" required>
                                <span class="salary-stepper">
                                    <button type="button" id="coefficient-up" aria-label="Tăng hệ số lương">▲</button>
                                    <button type="button" id="coefficient-down" aria-label="Giảm hệ số lương">▼</button>
                                </span>
                            </span>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="center">
                            <button>Tính lương tháng</button>
                        </td>
                    </tr>
                    <tr>
                        <th>Lương tháng</th>
                        <td>
                            <output id="salary-result" aria-live="polite">3200000</output>
                        </td>
                    </tr>
                </table>
            </form>
        </main>
        <!-- JavaScript đặt sau HTML để các ô và nút đã tồn tại khi xử lý. -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="cau1.js"></script>
    </body>
</html>
