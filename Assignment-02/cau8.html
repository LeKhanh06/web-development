<!DOCTYPE html>
<!-- Câu 8: Máy tính cơ bản (làm thêm câu 1). HTML/CSS trong file này; JavaScript nằm ở cau8.js. -->
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Làm thêm 1 — Máy tính</title>
        <!-- CSS dùng chung -->
        <style id="common-style">
/* CSS chung: bố cục cơ bản, bảng, ô nhập và nút. Mỗi bài tải thêm file CSS cùng tên. */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 16px;
    color: black;
    background: white;
    font: 16px "Times New Roman", serif;
    line-height: 1.2;
}

main {
    max-width: 1000px;
    margin: auto;
}

h1,
h2,
h3 {
    text-align: center;
}

a {
    color: #0033cc;
}

nav {
    margin-bottom: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    background: white;
}

th,
td {
    border: 1px solid #888;
    padding: 8px;
    text-align: left;
}

th {
    text-align: center;
}

input,
select,
textarea,
button {
    font: inherit;
    max-width: 100%;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="range"]),
textarea {
    width: 100%;
}

input,
select,
textarea {
    padding: 5px;
}

button {
    padding: 6px 16px;
    cursor: pointer;
}

button:focus-visible,
a:focus-visible {
    outline: 3px solid #006d77;
    outline-offset: 2px;
}

select[multiple] {
    width: 100%;
    min-height: 150px;
}

.form-table {
    max-width: 650px;
    margin: 16px auto;
}

.center {
    text-align: center;
}

.note {
    color: #555;
}

.error {
    color: #a40000;
}

@media (max-width: 750px) {
    body {
        padding: 12px;
    }
}

@media print {
    nav,
    .print-button {
        display: none;
    }
}

@media print {
    body {
        background: white;
        padding: 0;
    }
}

main {
    max-width: 920px;
}

nav {
    margin-bottom: 24px;
    font: 13px Arial, sans-serif;
}

h1 {
    font-size: 22px;
}

table {
    margin: 0;
}

th,
td {
    padding: 3px 5px;
    text-align: left;
    border-color: #999;
}

caption {
    padding: 4px;
    border: 1px solid #999;
    border-bottom: 0;
    font-weight: bold;
}

input,
select,
textarea,
button {
    font: 13px Arial, sans-serif;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="range"]):not([type="file"]) {
    width: 200px;
    height: 22px;
    padding: 1px 3px;
}

select {
    padding: 0;
}

textarea {
    padding: 2px;
}

button {
    padding: 2px 12px;
}

select[multiple] {
    min-height: 0;
}

.form-table {
    margin: 0 auto;
}

.note,
small {
    font: 12px Arial, sans-serif;
}

@media (max-width: 650px) {
    body {
        padding: 16px 8px;
    }
}
        </style>
        <!-- CSS riêng của câu 8 -->
        <style id="exercise-style">
/* Làm thêm 1 — Máy tính. */

.calculator {
    width: 310px;
    margin: auto;
    padding: 10px;
    background: white;
    border: 1px solid #aaa;
}

.calculator input,
.calculator output {
    display: block;
    width: 100%;
    min-height: 36px;
    text-align: right;
    overflow-wrap: anywhere;
}

.keys {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-top: 8px;
}

.keys button {
    background: #438dca;
    color: white;
    border: 0;
}

.keys .operator {
    background: #57b557;
}

.keys .clear {
    background: #d95050;
}

.keys .delete {
    background: #efb449;
}

.calculator-page {
    font-family: Arial, sans-serif;
}

.calculator-page h1 {
    display: none;
}

.calculator {
    width: 270px;
    padding: 8px;
    border-radius: 3px;
}

.calculator #expression {
    width: 100%;
    height: 30px;
    min-height: 30px;
    border: 1px solid #bbb;
    border-bottom: 0;
    background: #f8f8f8;
    text-align: left;
    font-size: 16px;
}

.calculator output {
    min-height: 30px;
    padding: 3px 5px;
    border: 1px solid #bbb;
    border-top: 0;
    background: #f8f8f8;
}

.keys {
    gap: 3px;
    margin-top: 6px;
}

.keys button {
    padding: 3px;
    border-radius: 3px;
    font-size: 18px;
}

.keys button:nth-last-child(-n+3) {
    background: #58c0d9;
}
        </style>
        <!-- CSS chỉ dùng khi mở trang kết quả, không áp dụng cho trang hiện tại. -->
        <style id="result-style" media="not all">
/* Định dạng chung cho trang hóa đơn, vé, đăng ký tour và kết quả CV. */

.result-page main {
    max-width: 460px;
    padding: 8px;
    border: 1px solid #888;
}

.result-page h1 {
    margin: 0 0 18px;
    font-size: 18px;
}

.result-page p {
    margin: 12px 0;
}

.result-page table {
    margin-top: 15px;
}

.result-page th,
.result-page td {
    border: 0;
    padding: 8px;
    text-align: center;
}

.result-page tr:last-child {
    font-weight: bold;
}

.result-page .print-button {
    display: block;
    margin: 20px auto 0;
}
        </style>
    </head>
    <body class="calculator-page">
        <main>
            <nav>
                <a href="index.html">← Danh sách bài</a>
            </nav>
            <h1>Máy tính cơ bản</h1>
            <div class="calculator">
                <input id="expression" readonly aria-label="Số và phép tính đang nhập">
                <output id="answer" aria-live="polite">0</output>
                <div class="keys">
                    <button class="clear" data-key="CE">CE</button>
                    <button class="delete" data-key="Del">Del</button>
                    <button class="operator" data-key="+">+</button>
                    <button class="operator" data-key="-">-</button>
                    <button class="operator" data-key="*">*</button>
                    <button class="operator" data-key="/">/</button>
                    <button data-key="9">9</button>
                    <button data-key="8">8</button>
                    <button data-key="7">7</button>
                    <button data-key="6">6</button>
                    <button data-key="5">5</button>
                    <button data-key="4">4</button>
                    <button data-key="3">3</button>
                    <button data-key="2">2</button>
                    <button data-key="1">1</button>
                    <button data-key="0">0</button>
                    <button data-key=".">.</button>
                    <button data-key="=">=</button>
                </div>
            </div>
        </main>
        <!-- JavaScript đặt sau HTML để các ô và nút đã tồn tại khi xử lý. -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="cau8.js"></script>
    </body>
</html>
